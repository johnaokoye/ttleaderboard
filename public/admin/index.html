<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1 class="page-title">Leaderboard Admin</h1>

    <section id="login-section" class="card">
      <h2>Sign in</h2>
      <form id="login-form">
        <input type="password" id="password" placeholder="Admin password" required />
        <button type="submit">Sign in</button>
      </form>
      <p class="error" id="login-error"></p>
    </section>

    <div id="dashboard" hidden>
      <div class="topbar">
        <a class="view-link" href="/" target="_blank" rel="noopener">View public board ↗</a>
        <button id="logout-btn" class="link-btn">Log out</button>
      </div>

      <section class="card">
        <h2>Competition</h2>
        <form id="settings-form">
          <label>
            Competition name
            <input type="text" id="comp-name" maxlength="120" required />
          </label>

          <fieldset>
            <legend>Mode</legend>
            <label class="radio"><input type="radio" name="mode" value="team" /> Teams only</label>
            <label class="radio"><input type="radio" name="mode" value="individual" /> Individuals only</label>
            <label class="radio"><input type="radio" name="mode" value="both" /> Both (teams with individuals)</label>
          </fieldset>

          <button type="submit">Save settings</button>
          <span class="status" id="settings-status"></span>
        </form>
      </section>

      <section class="card">
        <h2>Teams</h2>
        <form id="add-team-form" class="inline-form">
          <input type="text" id="team-name" placeholder="Team name" maxlength="64" required />
          <input type="number" id="team-score" placeholder="Starting score" value="0" />
          <button type="submit">Add team</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Score</th><th>Award points</th><th></th><th></th></tr></thead>
            <tbody id="teams-body"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Individuals</h2>
        <form id="add-individual-form" class="inline-form">
          <input type="text" id="indiv-name" placeholder="Name" maxlength="64" required />
          <select id="indiv-team"><option value="">No team</option></select>
          <input type="number" id="indiv-score" placeholder="Starting score" value="0" />
          <button type="submit">Add individual</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Team</th><th>Score</th><th>Award points</th><th></th><th></th></tr></thead>
            <tbody id="individuals-body"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Reset</h2>
        <p>Use this once a competition wraps up.</p>
        <div class="reset-actions">
          <button id="reset-scores-btn">Reset scores (keep teams &amp; individuals)</button>
          <button id="reset-all-btn" class="danger">Reset everything (wipe teams &amp; individuals)</button>
        </div>
      </section>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
